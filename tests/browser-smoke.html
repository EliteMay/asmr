<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>ASMRTube browser smoke</title></head>
<body data-status="RUNNING"><pre id="result">RUNNING</pre>
<script>
(async()=>{
  const result=document.querySelector('#result');
  const key='asmrtube.library.v1',settingsKey='asmrtube.settings.v1';
  const before=localStorage.getItem(key),beforeSettings=localStorage.getItem(settingsKey);
  const fail=message=>{document.body.dataset.status='FAIL';result.textContent=`FAIL: ${message}`;throw new Error(message)};
  const assert=(condition,message)=>{if(!condition)fail(message)};
  try{
    localStorage.setItem(key,JSON.stringify({library:[{id:'smoke-item',url:'https://www.youtube.com/watch?v=abcdefghijk',videoId:'abcdefghijk',title:'Smoke ASMR',creator:'Tester',tags:['耳かき'],rating:2,volume:35,favorite:false,sleepFriendly:false,timestamps:[],resumeAt:120,resumeDuration:1800,resumeUpdatedAt:1700000005000,createdAt:1700000000000},{id:'other-item',url:'https://www.youtube.com/watch?v=lmnopqrstuv',videoId:'lmnopqrstuv',title:'Other ASMR',creator:'Other Channel',tags:['囁き'],rating:1,volume:30,favorite:false,sleepFriendly:true,timestamps:[],createdAt:1699999999000}],playlists:[],recent:[]}));
    localStorage.setItem(settingsKey,JSON.stringify({theme:'violet',brightness:100,compact:false,showThumbs:false,reduceMotion:true,startDashboard:false}));
    const frame=document.createElement('iframe');frame.src='../index.html?smoke=1';frame.style.width='1200px';frame.style.height='800px';document.body.appendChild(frame);
    await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('app load timeout')),6000);frame.onload=()=>{clearTimeout(timer);setTimeout(resolve,500)}});
    const w=frame.contentWindow,d=frame.contentDocument;
    assert(d.querySelector('.song-item'),'library item did not render');
    d.querySelector('.song-item').click();
    assert(d.querySelector('#nowTitle')?.textContent==='Smoke ASMR','selection did not update topbar');
    assert(d.querySelector('#channelCount')?.textContent==='2','channel count did not render');
    assert(d.querySelectorAll('#channelList .channel-item').length===2,'channel list did not group library items');
    const otherChannel=[...d.querySelectorAll('#channelList .channel-item')].find(button=>button.textContent.includes('Other Channel'));
    assert(otherChannel,'Other Channel group is missing');
    otherChannel.click();
    assert(d.querySelectorAll('.song-item').length===1,'channel filter did not narrow the library');
    assert(d.querySelector('.song-item .song-meta strong')?.textContent==='Other ASMR','channel filter showed the wrong item');
    assert(d.querySelector('#nowTitle')?.textContent==='Other ASMR','channel selection did not keep the selected item in view');
    d.querySelector('.view-btn[data-view="all"]').click();
    assert(d.querySelector('#tagSidebarCount')?.textContent==='2','tag group count did not render');
    assert(d.querySelectorAll('#tagSidebarList .tag-sidebar-item').length===2,'tag sidebar did not group library tags');
    const whisperTag=[...d.querySelectorAll('#tagSidebarList .tag-sidebar-item')].find(button=>button.textContent.includes('囁き'));
    assert(whisperTag,'whisper tag group is missing');
    whisperTag.click();
    assert(d.querySelectorAll('.song-item').length===1,'tag sidebar filter did not narrow the library');
    assert(d.querySelector('.song-item .song-meta strong')?.textContent==='Other ASMR','tag sidebar filter showed the wrong item');
    assert(d.querySelector('#nowTitle')?.textContent==='Other ASMR','tag selection did not keep the selected item in view');
    d.querySelector('.view-btn[data-view="all"]').click();
    d.querySelectorAll('.song-item')[0]?.click();

    assert(d.querySelectorAll('.page-switch-btn').length===4,'primary page tabs did not render');
    assert(d.body.dataset.mainPage==='player','player page was not the default primary page');
    d.querySelector('#browsePageBtn').click();
    assert(d.body.dataset.mainPage==='browse','ASMR browse page did not open');
    assert(d.querySelectorAll('#browseGrid .library-browser-card').length===2,'ASMR browse page did not render the library');
    d.querySelector('#channelsPageBtn').click();
    assert(d.body.dataset.mainPage==='channels','channel page did not open');
    assert(d.querySelectorAll('#channelPageNav .library-entity-card').length===2,'channel page did not render channel choices');
    const channelPageChoice=[...d.querySelectorAll('#channelPageNav .library-entity-card')].find(button=>button.textContent.includes('Other Channel'));
    assert(channelPageChoice,'channel page choice is missing');
    channelPageChoice.click();
    assert(d.querySelectorAll('#channelPageGrid .library-browser-card').length===1,'channel page did not filter channel ASMR');
    d.querySelector('#tagsPageBtn').click();
    assert(d.body.dataset.mainPage==='tags','tag page did not open');
    const tagPageChoice=[...d.querySelectorAll('#tagPageNav .library-entity-card')].find(button=>button.textContent.includes('囁き'));
    assert(tagPageChoice,'tag page choice is missing');
    tagPageChoice.click();
    assert(d.querySelectorAll('#tagPageGrid .library-browser-card').length===1,'tag page did not filter tagged ASMR');
    d.querySelector('#playerPageBtn').click();
    assert(d.body.dataset.mainPage==='player','player page did not reopen');

    d.querySelector('#newPlaylistBtn').click();
    assert(d.querySelector('#playlistDialog')?.open,'playlist dialog did not open');
    assert(d.querySelector('#playlistName')?.value==='','playlist name was not reset');
    d.querySelector('#playlistDialog [data-dialog-close]').click();
    assert(!d.querySelector('#playlistDialog')?.open,'playlist close button was blocked by required validation');

    d.querySelector('#topAddBtn').click();
    assert(d.querySelector('#videoDialog')?.open,'video dialog did not open');
    assert(d.querySelector('#videoUrl')?.value==='','video URL was not empty for new item');
    d.querySelector('#videoDialog [data-dialog-close]').click();
    assert(!d.querySelector('#videoDialog')?.open,'video close button was blocked by required validation');

    d.querySelector('#saveFavoriteSectionBtn')?.click();
    assert(d.querySelector('#favoriteSectionDialog')?.open,'favorite section dialog did not open');
    d.querySelector('#favoriteSectionDialog [data-dialog-close]').click();
    assert(!d.querySelector('#favoriteSectionDialog')?.open,'favorite section close button did not close');
    assert(d.querySelector('#infoCard .favorite-section-empty'),'closing favorite section dialog accidentally submitted the form');

    assert(d.querySelector('#countResume')?.textContent==='1','resume count did not render');
    d.querySelector('.view-btn[data-view="resume"]').click();
    assert(d.querySelectorAll('.song-item').length===1,'resume view did not show resumable item');
    d.querySelector('.song-item').click();

    d.querySelector('#creatorPageBtn')?.click();
    assert(d.querySelector('#creatorDialog')?.open,'creator library did not open');
    assert(!d.querySelector('#creatorDialogBody .creator-work-thumb img'),'hidden thumbnails still create creator-library image requests');
    d.querySelector('#creatorDialog')?.close();

    d.querySelector('#settingsPageBtn').click();
    assert(d.body.classList.contains('settings-mode'),'settings page did not open');
    d.querySelector('#settingsBackBtn').click();
    assert(!d.body.classList.contains('settings-mode'),'settings page did not close');

    d.querySelector('#timestampImportBtn').click();
    const paste=d.querySelector('#timestampPaste');paste.value='▷ 0:10 親\n└ 0:20 子';
    d.querySelector('#parseTimestampsBtn').click();
    await new Promise(r=>setTimeout(r,50));
    assert(d.querySelectorAll('#timestampPreview .preview-grouped-row').length===2,'canonical timestamp parser is not wired to import UI');
    assert(w.getTimestampParseStats?.().parents===1,'parser parent role was not detected');
    d.querySelector('#timestampDialog').close();

    d.querySelector('#dashboardBtn').click();
    assert(d.querySelector('#nowTitle')?.textContent==='ライブラリ概要','dashboard did not open');
    d.querySelector('.view-btn[data-view="all"]').click();
    assert(d.querySelector('#nowTitle')?.textContent==='Smoke ASMR','dashboard exit did not restore topbar');

    assert(!d.querySelector('.song-item .thumb img'),'hidden thumbnails still create image requests');

    const button=d.querySelector('#filterBtn');button.focus();
    const beforeText=d.querySelector('#playBtn').textContent;
    button.dispatchEvent(new KeyboardEvent('keydown',{key:' ',code:'Space',bubbles:true,cancelable:true}));
    assert(d.querySelector('#playBtn').textContent===beforeText,'Space on focused button was stolen by playback shortcut');

    document.body.dataset.status='PASS';result.textContent='PASS';
  }finally{
    if(before==null)localStorage.removeItem(key);else localStorage.setItem(key,before);
    if(beforeSettings==null)localStorage.removeItem(settingsKey);else localStorage.setItem(settingsKey,beforeSettings);
  }
})().catch(error=>{if(document.body.dataset.status!=='FAIL'){document.body.dataset.status='FAIL';document.querySelector('#result').textContent=`FAIL: ${error.message}`}});
</script>
</body></html>
